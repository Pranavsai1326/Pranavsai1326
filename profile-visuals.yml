# Regenerates the profile's live visual assets — a contribution "snake" animation
# and a stats/top-languages card — from real, current GitHub data, and publishes
# them to a dedicated `output` branch (never `main`, so generated-asset commits
# never clutter real history). The README embeds the `output`-branch files
# directly, so nothing here ever needs a manual re-upload.
#
# Nothing in this workflow fabricates activity or creates filler commits: both
# steps only read real contribution/repository data and render it as an image.
name: Update profile visuals

on:
  schedule:
    - cron: "0 3 * * *"   # once a day at 03:00 UTC
  workflow_dispatch: {}    # lets you re-run this on demand from the Actions tab

permissions:
  contents: write   # required to push the generated SVGs to the `output` branch

jobs:
  build-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Contribution snake animation, light + dark variants, generated from
      #    the real public contribution graph.
      - name: Generate contribution snake (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: KunaPranavSai
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Publish the snake SVGs to the `output` branch. keep_files: false means
      #    this branch only ever holds the current generated assets.
      - name: Publish snake animation to the output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "chore: refresh contribution snake [skip ci]"

      # 3. Stats + top-languages card, rendered inside this Action run (no
      #    dependency on a third-party rendering server that can go down).
      #    Requires a classic PAT with `read:user` + `repo` scopes saved as the
      #    METRICS_TOKEN repo secret — see the setup checklist. Committed
      #    directly to the same `output` branch, alongside the snake SVGs above.
      - name: Generate stats & top-languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: KunaPranavSai
          template: classic
          base: "header, activity, community, repositories, metadata"
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          filename: metrics.svg
          committer_branch: output
          committer_message: "chore: refresh profile stats card [skip ci]"
